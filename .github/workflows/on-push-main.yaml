name: On Push Main

on:
  push:
    branches: [main, codex/openapi-contract-rebuild]
    tags: ["preview-*"]

jobs:
  backend:
    name: Build Backend
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/wf-docker-build.yaml
    with:
      target: backend
      push-ghcr: true
      save-cache: true
  frontend:
    name: Build Frontend
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/wf-docker-build.yaml
    with:
      target: frontend
      push-ghcr: true
      save-cache: true
