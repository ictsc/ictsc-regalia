name: PR preview publish

on:
  workflow_run:
    workflows: [PR preview build]
    types: [completed]

permissions:
  actions: read
  contents: read
  packages: write
  pull-requests: read

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    concurrency:
      group: preview-publish-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.id }}
      cancel-in-progress: false
    steps:
      - name: Validate run and PR using GitHub API
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          run=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}")
          test "$(jq -r .event <<< "$run")" = pull_request
          test "$(jq -r .name <<< "$run")" = 'PR preview build'
          test "$(jq -r .conclusion <<< "$run")" = success
          test "$(jq -r .head_repository.full_name <<< "$run")" = "$GITHUB_REPOSITORY"
          test "$(jq '.pull_requests | length' <<< "$run")" -eq 1
          number=$(jq -r '.pull_requests[0].number' <<< "$run")
          [[ "$number" =~ ^[1-9][0-9]*$ ]]
          pr=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${number}")
          test "$(jq -r .state <<< "$pr")" = open
          test "$(jq -r .head.repo.full_name <<< "$pr")" = "$GITHUB_REPOSITORY"
          jq -e '.labels | any(.name == "preview")' <<< "$pr" >/dev/null
          sha=$(jq -r .head.sha <<< "$pr")
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          test "$(jq -r '.pull_requests[0].head.sha' <<< "$run")" = "$sha"
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: preview-backend
          run-id: ${{ github.event.workflow_run.id }}
          path: backend
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: preview-frontend
          run-id: ${{ github.event.workflow_run.id }}
          path: frontend
          github-token: ${{ github.token }}
      - name: Install skopeo
        run: sudo apt-get update && sudo apt-get install -y skopeo
      - name: Recheck PR and publish fixed targets
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ steps.validate.outputs.number }}
          SHA: ${{ steps.validate.outputs.sha }}
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for image in backend frontend; do
            pr=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${NUMBER}")
            test "$(jq -r .state <<< "$pr")" = open
            test "$(jq -r .head.sha <<< "$pr")" = "$SHA"
            jq -e '.labels | any(.name == "preview")' <<< "$pr" >/dev/null
            dest="docker://ghcr.io/${GITHUB_REPOSITORY}/${image}:pr-${NUMBER}-${SHA}"
            test -f "${image}/${image}.tar"
            source="oci-archive:${image}/${image}.tar"
            source_digest=$(skopeo inspect --raw "$source" | sha256sum | cut -d' ' -f1)
            if existing=$(skopeo inspect --raw --creds "${GITHUB_ACTOR}:${REGISTRY_TOKEN}" "$dest" 2>inspect.err); then
              existing_digest=$(printf %s "$existing" | sha256sum | cut -d' ' -f1)
              test "$existing_digest" = "$source_digest"
              continue
            fi
            if ! grep -Eqi 'manifest unknown|not found|404' inspect.err; then
              cat inspect.err >&2
              exit 1
            fi
            skopeo copy --all --preserve-digests \
              --dest-creds "${GITHUB_ACTOR}:${REGISTRY_TOKEN}" \
              "$source" "$dest"
          done
