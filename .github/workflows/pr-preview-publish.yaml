name: PR preview publish

on:
  workflow_run:
    workflows: [PR preview build]
    types: [completed]

permissions:
  actions: read
  contents: read
  packages: write
  pull-requests: read

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    concurrency:
      group: preview-publish-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.id }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/heads/main
          persist-credentials: false
      - name: Validate run and PR using GitHub API
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" > run.json
          number=$(jq -r '.pull_requests[0].number' run.json)
          [[ "$number" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${number}" > pr.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts?per_page=100" > artifacts.json
          workflow_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/pr-preview-build.yaml" --jq .id)
          python3 .github/scripts/validate_preview_run.py \
            run.json pr.json artifacts.json "$workflow_id" "$GITHUB_REPOSITORY" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ steps.validate.outputs.backend_id }}
          run-id: ${{ github.event.workflow_run.id }}
          path: backend
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ steps.validate.outputs.frontend_id }}
          run-id: ${{ github.event.workflow_run.id }}
          path: frontend
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ steps.validate.outputs.migrations_id }}
          run-id: ${{ github.event.workflow_run.id }}
          path: migrations
          github-token: ${{ github.token }}
      - name: Install skopeo
        run: sudo apt-get update && sudo apt-get install -y skopeo
      - name: Recheck PR and publish fixed targets
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ steps.validate.outputs.number }}
          SHA: ${{ steps.validate.outputs.sha }}
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for image in backend frontend migrations; do
            pr=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${NUMBER}")
            test "$(jq -r .state <<< "$pr")" = open
            test "$(jq -r .head.sha <<< "$pr")" = "$SHA"
            jq -e '.labels | any(.name == "preview")' <<< "$pr" >/dev/null
            dest="docker://ghcr.io/${GITHUB_REPOSITORY}/${image}:pr-${NUMBER}-${SHA}"
            test -f "${image}/${image}.tar"
            source="oci-archive:${image}/${image}.tar"
            skopeo inspect --raw "$source" > source-manifest.json
            if skopeo inspect --raw --creds "${GITHUB_ACTOR}:${REGISTRY_TOKEN}" "$dest" > existing-manifest.json 2>inspect.err; then
              python3 .github/scripts/compare_preview_manifest.py source-manifest.json existing-manifest.json
              continue
            fi
            if ! grep -Eqi 'manifest unknown|not found|404' inspect.err; then
              cat inspect.err >&2
              exit 1
            fi
            skopeo copy --all --preserve-digests \
              --dest-creds "${GITHUB_ACTOR}:${REGISTRY_TOKEN}" \
              "$source" "$dest"
            skopeo inspect --raw --creds "${GITHUB_ACTOR}:${REGISTRY_TOKEN}" "$dest" > published-manifest.json
            python3 .github/scripts/compare_preview_manifest.py source-manifest.json published-manifest.json
          done
