services:
  api:
    build:
      context: .
      target: development
    init: true
    ports:
      - 127.0.0.1:8080:8080
    environment:
      ICTSC_API_ADDRESS: ":8080"
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ictsc
      PGPASSWORD: password
      PGDATABASE: ictscore
      PGSSLMODE: disable
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/workspace
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build

  postgres:
    image: postgres:18
    restart: unless-stopped
    ports:
      - 127.0.0.1::5432
    environment:
      POSTGRES_USER: ictsc
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ictscore
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ictsc -d ictscore"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/20-seed.sql:ro

  redis:
    image: redis:8
    restart: unless-stopped
    ports:
      - 127.0.0.1::6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - redis-data:/data

volumes:
  go-mod-cache:
  go-build-cache:
  postgres-data:
  redis-data:
