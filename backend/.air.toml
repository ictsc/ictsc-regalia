root = "."
tmp_dir = ".air"

[build]
cmd = "go build -o ./.air/api ./cmd/api"
entrypoint = ["./.air/api"]
include_ext = ["go"]
exclude_dir = [".air", "vendor"]
exclude_regex = ["_test.go"]
delay = 500
stop_on_error = true
send_interrupt = true
kill_delay = "500ms"

[log]
time = true

[misc]
clean_on_exit = true
